name: CI

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - name: Validate metadata
      run: npm run validate

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - name: Lint
      run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - name: Run tests
      run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - name: Verify package-lock.json is in sync
      run: |
        npm cache clean --force
        npm install --package-lock-only --prefer-online
        if [ -n "$(git status --porcelain package-lock.json)" ]; then
          echo "Error: package-lock.json is out of sync with package.json"
          echo "Please run 'npm install' and commit the updated package-lock.json"
          exit 1
        fi
    - name: Build
      run: npm run build
    - name: Verify dist is up-to-date
      run: |
        if [ -n "$(git status --porcelain dist/)" ]; then
          echo "Error: dist/ directory has uncommitted changes after build"
          echo "Please run 'npm run build' and commit the changes"
          git diff --stat dist/
          exit 1
        fi
